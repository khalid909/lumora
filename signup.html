<!doctype html>
<html lang="ar" dir="rtl" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>إنشاء حساب — Lumora</title>
<meta name="theme-color" content="#6d4aff">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/admin.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

<section class="auth-screen" style="display:grid;min-height:100vh">
  <div class="auth-card">
    <div class="auth-logo">
      <img src="icon.svg" alt="" width="42" height="42">
      <h1>Lumora</h1>
    </div>
    <p class="auth-sub">أنشئ حسابك في دقيقة واحدة</p>

    <form id="signupForm" class="form-stack">
      <label>
        <span>الاسم الكامل *</span>
        <input name="full_name" required autocomplete="name" placeholder="محمد أحمد">
      </label>
      <label>
        <span>البريد الإلكتروني *</span>
        <input type="email" name="email" required autocomplete="email" dir="ltr" placeholder="you@example.com">
      </label>
      <label>
        <span>كلمة المرور * (6 أحرف على الأقل)</span>
        <input type="password" name="password" required minlength="6" autocomplete="new-password" dir="ltr">
      </label>
      <div class="grid-2">
        <label>
          <span>الهاتف</span>
          <input name="phone" type="tel" autocomplete="tel" dir="ltr" placeholder="+213555...">
        </label>
        <label>
          <span>المدينة</span>
          <input name="city" autocomplete="address-level2">
        </label>
      </div>
      <label>
        <span>العنوان</span>
        <input name="address" autocomplete="street-address">
      </label>
      <p class="err" id="signupErr" hidden></p>
      <p class="err ok" id="signupOk" hidden></p>
      <button class="btn block" type="submit" id="signupBtn">
        <span>إنشاء الحساب</span>
      </button>
    </form>

    <p class="auth-note">
      لديك حساب؟ <a href="login.html" style="color:var(--p);font-weight:700">سجّل الدخول</a>
      <br><br>
      <a href="./" style="color:var(--muted)">← رجوع للمتجر</a>
    </p>
  </div>
</section>

<div class="toast" id="toast" role="status"></div>

<script>
const SUPABASE_URL = 'https://mpoqvpqeysgoqjtcwtfk.supabase.co';
const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im1wb3F2cHFleXNnb3FqdGN3dGZrIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTE0ODE1NTUsImV4cCI6MjEwNzA1NzU1NX0.i0YEZkxAmy4wEnX0QP8Hm2erm1bxPFmO6sp78clevb0';

const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

const $ = s => document.querySelector(s);
let toastT;
function toast(msg, kind = '') {
  const el = $('#toast');
  el.textContent = msg;
  el.className = 'toast on ' + kind;
  clearTimeout(toastT);
  toastT = setTimeout(() => el.className = 'toast ' + kind, 3000);
}

$('#signupForm').addEventListener('submit', async e => {
  e.preventDefault();
  const btn = $('#signupBtn'), err = $('#signupErr'), ok = $('#signupOk');
  err.hidden = true; ok.hidden = true;
  btn.disabled = true;
  btn.innerHTML = '<span>جارٍ الإنشاء…</span>';

  const fd = Object.fromEntries(new FormData(e.target));
  
  // 1. إنشاء المستخدم
  const { data, error } = await sb.auth.signUp({
    email: fd.email,
    password: fd.password,
    options: {
      data: {
        full_name: fd.full_name,
        phone: fd.phone,
        city: fd.city,
        address: fd.address
      }
    }
  });

  btn.disabled = false;
  btn.innerHTML = '<span>إنشاء الحساب</span>';

  if (error) {
    err.textContent = error.message;
    err.hidden = false;
    return;
  }

  // 2. نجاح
  ok.textContent = '✓ تم إنشاء حسابك! جارٍ تحويلك…';
  ok.hidden = false;
  toast('✓ مرحبًا بك في Lumora!', 'ok');

  // 3. الانتقال للمتجر أو لصفحة الحساب
  setTimeout(() => {
    location.href = 'account.html';
  }, 1500);
});

// إذا كان المستخدم مسجلاً بالفعل → وجّهه للحساب
(async () => {
  const { data: { session } } = await sb.auth.getSession();
  if (session) location.href = 'account.html';
})();
</script>
</body>
</html>
