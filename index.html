<!doctype html>
<html lang="ar" dir="rtl" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Lumora</title>
<meta name="description" content="Lumora — متجر إلكتروني عصري • Boutique en ligne • Online store">
<meta name="theme-color" content="#6d4aff">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<script type="application/ld+json" id="ld">{}</script>
</head>
<body>
<a class="skip" href="#shop" data-i18n="skip"></a>
<div class="topbar"><span data-i18n="topbar"></span></div>

<header class="header" id="header">
  <div class="wrap hrow">
    <a class="logo" href="./" aria-label="Home"><img src="icon.svg" alt="" width="34" height="34"><span id="brandName">Lumora</span></a>
    <form class="search" role="search" id="searchForm" autocomplete="off">
      <span class="si" aria-hidden="true">🔍</span>
      <input id="q" type="search" data-i18n-ph="search_ph" aria-label="Search" enterkeyhint="search">
      <button type="button" class="icon-btn mic" id="mic" hidden aria-label="Voice search">🎤</button>
      <kbd aria-hidden="true">/</kbd>
    </form>
    <div class="actions">
      <div class="seg" id="langs" role="group" aria-label="Language">
        <button type="button" data-lang="ar">ع</button><button type="button" data-lang="fr">FR</button><button type="button" data-lang="en">EN</button>
      </div>
      <button class="icon-btn" id="themeBtn" aria-label="Theme">🌓</button>
      <button class="icon-btn" id="wishBtn" aria-label="Wishlist" aria-pressed="false">♡<span class="badge" id="wishCount" hidden>0</span></button>
      <button class="icon-btn" id="cartBtn" aria-label="Cart">🛒<span class="badge" id="cartCount" hidden>0</span></button>
    </div>
  </div>
</header>

<main>
  <section class="hero">
    <div class="blob b1"></div><div class="blob b2"></div>
    <div class="wrap hgrid">
      <div class="htext">
        <span class="pill" data-i18n="hero_badge"></span>
        <h1 data-i18n="hero_title"></h1>
        <p data-i18n="hero_sub"></p>
        <div class="hbtns">
          <a class="btn lg" href="#shop" data-i18n="hero_cta"></a>
          <a class="btn ghost lg" href="#shop" id="dealsBtn" data-i18n="hero_cta2"></a>
        </div>
        <div class="flash"><span data-i18n="flash"></span>
          <div class="cd" dir="ltr" aria-live="off"><b id="cdH">00</b>:<b id="cdM">00</b>:<b id="cdS">00</b></div>
        </div>
      </div>
      <div class="hvis" id="heroCards" aria-hidden="true"></div>
    </div>
  </section>

  <section class="wrap strip">
    <div><span>🚚</span><b data-i18n="f1t"></b><small data-i18n="f1d"></small></div>
    <div><span>💳</span><b data-i18n="f2t"></b><small data-i18n="f2d"></small></div>
    <div><span>↩️</span><b data-i18n="f3t"></b><small data-i18n="f3d"></small></div>
    <div><span>💬</span><b data-i18n="f4t"></b><small data-i18n="f4d"></small></div>
  </section>

  <section class="wrap shop" id="shop">
    <div class="chips" id="cats" role="tablist"></div>
    <div class="toolbar">
      <span class="count" id="count" aria-live="polite"></span>
      <label class="range"><span data-i18n="max_price"></span>
        <input type="range" id="maxRange" min="0" max="200" value="200"><b id="maxLabel"></b>
      </label>
      <select id="sort" aria-label="Sort">
        <option value="pop" data-i18n="sort_pop"></option>
        <option value="new" data-i18n="sort_new"></option>
        <option value="deal" data-i18n="sort_deal"></option>
        <option value="low" data-i18n="sort_low"></option>
        <option value="high" data-i18n="sort_high"></option>
        <option value="rate" data-i18n="sort_rate"></option>
      </select>
    </div>
    <div class="grid" id="grid"></div>
  </section>

  <section class="wrap shop" id="recent" hidden>
    <h2 class="h2" data-i18n="recent"></h2>
    <div class="grid" id="recentGrid"></div>
  </section>
</main>

<footer class="footer">
  <div class="wrap frow">
    <div><div class="logo"><img src="icon.svg" alt="" width="28" height="28"><span class="brand2">Lumora</span></div>
      <p data-i18n="footer_about"></p></div>
    <div class="fbtns">
      <button class="btn ghost sm" id="installBtn" hidden data-i18n="install"></button>
      <button class="btn ghost sm" id="adminBtn" data-i18n="admin"></button>
    </div>
  </div>
  <div class="wrap copy">© <span id="year"></span> <span class="brand2">Lumora</span> — <span data-i18n="rights"></span></div>
</footer>

<!-- Cart drawer -->
<div class="scrim" id="scrim"></div>
<aside class="drawer" id="drawer" aria-label="Cart" inert>
  <header><h2 data-i18n="cart"></h2><button class="icon-btn" data-close-drawer aria-label="Close">✕</button></header>
  <div class="dbody" id="cartBody"></div>
  <footer id="cartFoot"></footer>
</aside>

<!-- Product dialog -->
<dialog id="pd" aria-label="Product"><button class="x" data-close aria-label="Close">✕</button><div id="pdBody"></div></dialog>

<!-- Checkout dialog -->
<dialog id="co" aria-label="Checkout">
  <canvas id="confetti" aria-hidden="true"></canvas>
  <button class="x" data-close aria-label="Close">✕</button>
  <div class="pad" id="coFormWrap">
    <h2 data-i18n="co_title"></h2>
    <div class="cogrid">
      <form id="coForm" class="form" novalidate>
        <label><span data-i18n="name"></span><input name="name" required autocomplete="name"></label>
        <label><span data-i18n="phone"></span><input name="phone" type="tel" required autocomplete="tel" inputmode="tel" dir="ltr"></label>
        <p class="err" id="phoneErr" data-i18n="phone_bad" hidden></p>
        <label><span data-i18n="city"></span><input name="city" required autocomplete="address-level2"></label>
        <label><span data-i18n="address"></span><input name="address" required autocomplete="street-address"></label>
        <label><span data-i18n="notes"></span><textarea name="notes" rows="2"></textarea></label>
        <div class="pay" data-i18n="pay_cod"></div>
        <button class="btn block lg" data-i18n="place"></button>
      </form>
      <div class="cosum" id="coSummary"></div>
    </div>
  </div>
  <div class="pad done" id="coDone" hidden>
    <div class="big">🎉</div>
    <h2 data-i18n="order_ok"></h2>
    <p data-i18n="order_ok_sub"></p>
    <p class="ono"><span data-i18n="order_no"></span>: <b id="orderNo"></b></p>
    <button class="btn" data-close data-i18n="close"></button>
  </div>
</dialog>

<!-- Admin dialog -->
<dialog id="ad" aria-label="Admin"><button class="x" data-close aria-label="Close">✕</button><div class="pad" id="adBody"></div></dialog>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script src="js/config.js"></script>
<script src="js/i18n.js"></script>
<script src="js/data.js"></script>
<script src="js/app.js"></script>
</body>
</html>
