<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تسجيل دخول الزبون - Hwayeg</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, sans-serif; }
        body { background: #f8fafc; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; }
        .card { background: #fff; border: 1px solid #e2e8f0; border-radius: 14px; padding: 32px; width: 100%; max-width: 400px; }
        h1 { font-size: 1.4rem; margin-bottom: 6px; color: #0f172a; text-align: center; }
        p.sub { font-size: 0.85rem; color: #64748b; margin-bottom: 20px; text-align: center; }
        .form-group { margin-bottom: 16px; }
        label { display: block; font-size: 0.85rem; font-weight: 600; margin-bottom: 6px; }
        input { width: 100%; padding: 10px 12px; border: 1px solid #cbd5e1; border-radius: 8px; outline: none; }
        input:focus { border-color: #3b82f6; }
        .btn { width: 100%; padding: 11px; background: #2563eb; color: #fff; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; margin-top: 8px; }
        .btn:hover { background: #1d4ed8; }
        .alert { background: #fee2e2; color: #dc2626; padding: 9px; border-radius: 7px; font-size: 0.85rem; margin-bottom: 14px; display: none; }
        .links { text-align: center; margin-top: 18px; font-size: 0.85rem; color: #64748b; }
        .links a { color: #2563eb; text-decoration: none; }
        .vendor-switch { margin-top: 15px; padding-top: 15px; border-top: 1px solid #e2e8f0; text-align: center; font-size: 0.85rem; }
    </style>
</head>
<body>
    <div class="card">
        <h1>تسجيل الدخول</h1>
        <p class="sub">مرحباً بك مجدداً في متجر Hwayeg</p>

        <div id="userError" class="alert"></div>

        <form id="customerLoginForm">
            <div class="form-group">
                <label>البريد الإلكتروني</label>
                <input type="email" id="customerEmail" placeholder="yourname@gmail.com" required>
            </div>
            <div class="form-group">
                <label>كلمة المرور</label>
                <input type="password" id="customerPassword" placeholder="••••••••" required>
            </div>
            <button type="submit" id="custBtn" class="btn">دخول</button>
        </form>

        <div class="links">
            <a href="Forgot password">نسيت كلمة المرور؟</a> | <a href="signup.html">إنشاء حساب جديد</a>
        </div>

        <div class="vendor-switch">
            هل أنت تاجر؟ <a href="vendor-login.html" style="font-weight: bold; color: #7c3aed;">دخول التجار من هنا ↗</a>
        </div>
    </div>

    <script>
        const SUPABASE_URL = 'https://mpqvpqeysgoqjtcwtfk.supabase.co'; // رابط مشروعك في lumora
        const SUPABASE_KEY = 'https://mpoqvpqeysgoqjtcwtfk.supabase.co/rest/v1/';
        const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        document.getElementById('customerLoginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('custBtn');
            const alertBox = document.getElementById('userError');
            alertBox.style.display = 'none';

            btn.disabled = true;
            btn.innerText = 'جارٍ الدخول...';

            const email = document.getElementById('customerEmail').value.trim();
            const password = document.getElementById('customerPassword').value;

            const { data, error } = await supabase.auth.signInWithPassword({ email, password });

            if (error) {
                alertBox.innerText = 'البريد أو كلمة المرور غير صحيحة';
                alertBox.style.display = 'block';
                btn.disabled = false;
                btn.innerText = 'دخول';
                return;
            }

            // توجيه الزبون إلى صفحة حسابه
            window.location.href = 'account.html';
        });
    </script>
</body>
</html>
