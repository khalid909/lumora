<!doctype html>
<html lang="ar" dir="rtl" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>تعديل المنتج — Lumora</title>
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/admin.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  body { background: var(--bg); padding: 40px 20px; display: flex; justify-content: center; }
  .edit-container { background: var(--surface); border: 1px solid var(--line); border-radius: 20px; width: 100%; max-width: 800px; padding: 30px; box-shadow: var(--shadow); }
  .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px; padding-bottom: 16px; border-bottom: 1px solid var(--line); }
  .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
  @media(max-width: 600px) { .form-grid { grid-template-columns: 1fr; } }
  
  .form-group { display: flex; flex-direction: column; gap: 8px; }
  .form-group label { font-weight: 700; font-size: 0.95rem; }
  .form-group input, .form-group select, .form-group textarea { 
    padding: 12px; border: 1px solid var(--line); border-radius: 10px; background: var(--surface2); font-size: 1rem; outline: none; transition: 0.2s;
  }
  
  /* معرض الصور */
  .gallery-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(100px, 1fr)); gap: 10px; margin-top: 10px; }
  .gallery-item { position: relative; aspect-ratio: 1; border-radius: 10px; overflow: hidden; border: 1px solid var(--line); }
  .gallery-item img { width: 100%; height: 100%; object-fit: cover; }
  .del-img-btn { position: absolute; top: 4px; right: 4px; background: rgba(255,0,0,0.8); color: #fff; border: none; border-radius: 50%; width: 24px; height: 24px; cursor: pointer; display: grid; place-items: center; font-size: 12px; }
  .upload-box { border: 2px dashed var(--line); border-radius: 12px; padding: 20px; text-align: center; cursor: pointer; transition: 0.2s; }
  .upload-box:hover { border-color: var(--p); background: var(--surface2); }
  .upload-box input[type="file"] { position: absolute; inset: 0; opacity: 0; cursor: pointer; }
  
  .actions { display: flex; gap: 12px; margin-top: 30px; justify-content: flex-end; }
</style>
</head>
<body>

<div class="edit-container">
  <div class="header">
    <h1>✏️ تعديل المنتج</h1>
    <a href="vendor.html" class="btn ghost sm">← العودة للوحة التحكم</a>
  </div>

  <form id="editForm" class="form-grid">
    <input type="hidden" id="prodId" name="id">
    
    <div class="form-group" style="grid-column: 1/-1;">
      <label>اسم المنتج *</label>
      <input type="text" id="prodName" name="name" required>
    </div>

    <div class="form-group">
      <label>السعر (دج) *</label>
      <input type="number" id="prodPrice" name="price" required min="0">
    </div>

    <div class="form-group">
      <label>المخزون *</label>
      <input type="number" id="prodStock" name="stock" required min="0">
    </div>

    <div class="form-group" style="grid-column: 1/-1;">
      <label>صور المنتج (يمكنك إضافة أو حذف الصور)</label>
      
      <!-- معرض الصور الحالية -->
      <div class="gallery-grid" id="galleryGrid"></div>

      <!-- زر إضافة صور جديدة -->
      <div class="upload-box" style="position: relative; margin-top: 10px;">
        <div style="font-size: 1.5rem; margin-bottom: 5px;">📸</div>
        <span class="muted">اضغط لاختيار صور جديدة (الحد الأقصى 10 صور)</span>
        <input type="file" id="newImages" accept="image/*" multiple>
      </div>
    </div>

    <div class="form-group" style="grid-column: 1/-1;">
      <label>الوصف</label>
      <textarea id="prodDesc" name="desc" rows="3" placeholder="وصف تفصيلي للمنتج..."></textarea>
    </div>

    <p class="err" id="editErr" hidden style="grid-column: 1/-1; color: red; text-align: center;"></p>

    <div class="actions" style="grid-column: 1/-1;">
      <button type="submit" class="btn" id="saveBtn" style="flex: 1;">💾 حفظ التعديلات</button>
      <a href="vendor.html" class="btn ghost">إلغاء</a>
    </div>
  </form>
</div>

<script>
const sb = window.supabase.createClient(
  'https://mpoqvpqeysgoqjtcwtfk.supabase.co',
  'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im1wb3F2cHFleXNnb3FqdGN3dGZrIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTE0ODE1NTUsImV4cCI6MjEwNzA1NzU1NX0.i0YEZkxAmy4wEnX0QP8Hm2erm1bxPFmO6sp78clevb0'
);

let currentImages = []; // مصفوفة لحفظ روابط الصور الحالية

async function loadProduct() {
  const id = new URLSearchParams(window.location.search).get('id');
  if (!id) return window.location.href = 'vendor.html';

  const { data: p } = await sb.from('products').select('*').eq('id', id).single();
  if (!p) return window.location.href = 'vendor.html';

  document.getElementById('prodId').value = p.id;
  document.getElementById('prodName').value = p.name?.ar || '';
  document.getElementById('prodPrice').value = p.price;
  document.getElementById('prodStock').value = p.stock;
  document.getElementById('prodDesc').value = p.description?.ar || '';
  
  // تجميع الصور (الصورة الرئيسية + معرض الصور)
  currentImages = [];
  if (p.img) currentImages.push(p.img);
  if (p.gallery && Array.isArray(p.gallery)) {
    p.gallery.forEach(img => {
      if (img !== p.img && !currentImages.includes(img)) currentImages.push(img);
    });
  }
  
  renderGallery();
}

function renderGallery() {
  const grid = document.getElementById('galleryGrid');
  grid.innerHTML = currentImages.map((url, index) => `
    <div class="gallery-item">
      <img src="${url}" alt="صورة ${index + 1}">
      ${index === 0 ? '<span style="position:absolute; bottom:4px; left:4px; background:var(--p); color:#fff; font-size:10px; padding:2px 6px; border-radius:4px;">رئيسية</span>' : ''}
      <button type="button" class="del-img-btn" onclick="removeImage(${index})">✕</button>
    </div>
  `).join('');
}

function removeImage(index) {
  currentImages.splice(index, 1);
  renderGallery();
}

document.getElementById('editForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const btn = document.getElementById('saveBtn');
  const err = document.getElementById('editErr');
  err.hidden = true;
  btn.disabled = true; btn.textContent = 'جارٍ الحفظ...';

  const id = document.getElementById('prodId').value;
  const files = document.getElementById('newImages').files;

  // التحقق من عدد الصور
  if (currentImages.length + files.length > 10) {
    err.textContent = 'الحد الأقصى هو 10 صور لكل منتج.';
    err.hidden = false;
    btn.disabled = false; btn.textContent = '💾 حفظ التعديلات';
    return;
  }

  // رفع الصور الجديدة
  let newUploadedUrls = [];
  for (let i = 0; i < files.length; i++) {
    const file = files[i];
    const fileName = `prod-${Date.now()}-${i}.${file.name.split('.').pop()}`;
    const { error: uploadError } = await sb.storage.from('vendor-assets').upload(fileName, file);
    if (!uploadError) {
      const { data } = sb.storage.from('vendor-assets').getPublicUrl(fileName);
      newUploadedUrls.push(data.publicUrl);
    }
  }

  const finalImages = [...currentImages, ...newUploadedUrls];
  const mainImage = finalImages.length > 0 ? finalImages[0] : '';

  const updates = {
    name: { ar: document.getElementById('prodName').value, fr: '', en: '' },
    price: Number(document.getElementById('prodPrice').value),
    stock: Number(document.getElementById('prodStock').value),
    description: { ar: document.getElementById('prodDesc').value, fr: '', en: '' },
    img: mainImage,
    gallery: finalImages // حفظ المصفوفة المحدثة
  };

  const { error: updateError } = await sb.from('products').update(updates).eq('id', id);

  btn.disabled = false; btn.textContent = '💾 حفظ التعديلات';

  if (updateError) {
    err.textContent = updateError.message; err.hidden = false;
  } else {
    alert('تم حفظ التعديلات بنجاح!');
    window.location.href = 'vendor.html';
  }
});

loadProduct();
</script>
</body>
</html>
