<!doctype html>
<html lang="ar" dir="rtl" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>المتجر — Lumora</title>
<link rel="icon" id="dynamicFavicon" href="icon.svg" type="image/svg+xml">
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  .store-header { background: var(--surface); border-bottom: 1px solid var(--line); padding: 40px 20px; text-align: center; }
  .store-logo { width: 90px; height: 90px; margin: 0 auto 16px; display: flex; align-items: center; justify-content: center; }
  .store-logo img { width: 100%; height: 100%; object-fit: contain; border-radius: 16px; }
  .store-header h1 { font-size: 2rem; margin-bottom: 8px; }
  .store-header p { color: var(--muted); max-width: 600px; margin: 0 auto; }
  
  .store-topbar { background: var(--surface); border-bottom: 1px solid var(--line); padding: 12px; }
  .store-topbar .logo-text { font-weight: 800; font-size: 1.2rem; color: var(--text); text-decoration: none; display: flex; align-items: center; gap: 8px;}
  .store-topbar .logo-text img { width: 30px; height: 30px; object-fit: contain; border-radius: 6px; }

  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(235px,1fr)); gap: 18px; }
  .card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); overflow: hidden; transition: .25s; cursor: pointer; }
  .card:hover { box-shadow: var(--shadow); border-color: var(--p); transform: translateY(-2px); }
  .thumb { position: relative; aspect-ratio: 1; background: var(--surface2); }
  .thumb img { width: 100%; height: 100%; object-fit: cover; }
  .card .body { padding: 14px; }
  .card h3 { font-size: 1rem; line-height: 1.35; margin-bottom: 4px; min-height: 2.7em; }
  .price b { font-size: 1.1rem; color: var(--p); }

  /* نافذة المنتج (Modal) */
  .modal { position: fixed; inset: 0; background: rgba(0,0,0,0.6); display: none; align-items: center; justify-content: center; z-index: 100; padding: 20px; backdrop-filter: blur(4px); }
  .modal.active { display: flex; }
  .modal-content { background: var(--surface); border-radius: 20px; max-width: 800px; width: 100%; display: grid; grid-template-columns: 1fr 1fr; overflow: hidden; position: relative; max-height: 90vh; }
  .modal-img { background: var(--surface2); width: 100%; height: 100%; object-fit: cover; min-height: 300px; }
  .modal-body { padding: 30px; display: flex; flex-direction: column; justify-content: center; overflow-y: auto; }
  .modal-body h2 { font-size: 1.8rem; margin-bottom: 10px; }
  .modal-body .p-price { font-size: 2rem; font-weight: 800; color: var(--p); margin-bottom: 20px; }
  .modal-body p { color: var(--muted); line-height: 1.8; margin-bottom: 20px; }
  .modal-close { position: absolute; top: 15px; left: 15px; background: var(--surface); border: 1px solid var(--line); border-radius: 50%; width: 40px; height: 40px; display: grid; place-items: center; cursor: pointer; z-index: 10; font-size: 1.2rem; }
  @media(max-width: 768px) { .modal-content { grid-template-columns: 1fr; } .modal-img { height: 250px; } }
</style>
</head>
<body>

<!-- الشريط العلوي -->
<div class="topbar store-topbar">
  <div class="wrap" style="display:flex; justify-content:space-between; align-items:center;">
    <a href="#" id="topbarBrand" class="logo-text">
      <span id="topbarName">جاري التحميل...</span>
    </a>
    <a href="index.html" class="btn sm ghost">← العودة للمنصة</a>
  </div>
</div>

<header class="store-header">
  <div class="store-logo" id="storeLogo">S</div>
  <h1 id="storeName">جاري التحميل...</h1>
  <p id="storeDesc">مرحباً بك في متجرنا</p>
</header>

<main class="wrap" style="padding: 40px 0;">
  <h2 style="margin-bottom: 20px; font-size: 1.4rem;">منتجات المتجر</h2>
  <div class="grid" id="productsGrid">
    <p class="muted" style="grid-column:1/-1; text-align:center;">جاري تحميل المنتجات...</p>
  </div>
</main>

<!-- نافذة تفاصيل المنتج -->
<div class="modal" id="productModal">
  <div class="modal-content">
    <button class="modal-close" onclick="closeModal()">✕</button>
    <img class="modal-img" id="modalImg" src="" alt="">
    <div class="modal-body">
      <h2 id="modalName"></h2>
      <div class="p-price" id="modalPrice"></div>
      <p id="modalDesc">لا يوجد وصف لهذا المنتج.</p>
      <button class="btn lg block" style="margin-top:auto;">🛒 أضف للسلة</button>
    </div>
  </div>
</div>

<script>
const sb = window.supabase.createClient(
  'https://mpoqvpqeysgoqjtcwtfk.supabase.co',
  'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im1wb3F2cHFleXNnb3FqdGN3dGZrIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTE0ODE1NTUsImV4cCI6MjEwNzA1NzU1NX0.i0YEZkxAmy4wEnX0QP8Hm2erm1bxPFmO6sp78clevb0'
);
const fmt = n => new Intl.NumberFormat('ar-DZ', { style: 'currency', currency: 'DZD', minimumFractionDigits: 0 }).format(n || 0);

let storeProducts = []; // لتخزين المنتجات لاستخدامها في النافذة

async function loadStore() {
  const params = new URLSearchParams(window.location.search);
  const slug = params.get('slug');
  if (!slug) return;

  const { data: vendor, error: vErr } = await sb.from('vendors').select('*').eq('store_slug', slug).maybeSingle();
  if (vErr || !vendor) return;

  document.title = vendor.store_name + ' — Lumora';
  document.getElementById('topbarName').textContent = vendor.store_name;
  const topbarBrand = document.getElementById('topbarBrand');
  
  if (vendor.store_logo) {
    topbarBrand.innerHTML = `<img src="${vendor.store_logo}" alt=""> <span>${vendor.store_name}</span>`;
    document.getElementById('storeLogo').innerHTML = `<img src="${vendor.store_logo}" alt="">`;
    document.getElementById('dynamicFavicon').href = vendor.store_logo;
  } else {
    topbarBrand.innerHTML = `<span>${vendor.store_name}</span>`;
    document.getElementById('storeLogo').textContent = vendor.store_name.charAt(0).toUpperCase();
  }
  
  document.getElementById('storeName').textContent = vendor.store_name;
  if(vendor.store_description) document.getElementById('storeDesc').textContent = vendor.store_description;

  // جلب المنتجات
  const { data: products, error: pErr } = await sb.from('products').select('*').eq('vendor_id', vendor.id);
  const grid = document.getElementById('productsGrid');

  if (pErr || !products || products.length === 0) {
    grid.innerHTML = '<p class="muted" style="grid-column:1/-1; text-align:center; padding:40px;">هذا المتجر لم يقم بإضافة أي منتجات بعد.</p>';
    return;
  }

  storeProducts = products; // حفظ المنتجات

  // عرض المنتجات مع إضافة onclick لفتح النافذة
   grid.innerHTML = products.map((p) => `
    <article class="card" onclick="window.location.href='product.html?id=' + p.id">
      <div class="thumb">
        ${p.img ? `<img src="${p.img}" alt="${p.name?.ar || 'منتج'}">` : `<div style="width:100%; height:100%; display:grid; place-items:center; font-size:3rem; background:var(--surface2);">📦</div>`}
      </div>
      <div class="body">
        <h3>${p.name?.ar || 'منتج'}</h3>
        <div class="price"><b>${fmt(p.price)}</b></div>
      </div>
    </article>
  `).join('');
}

// فتح النافذة
function openModal(index) {
  const p = storeProducts[index];
  if (!p) return;

  const imgEl = document.getElementById('modalImg');
  if (p.img) {
    imgEl.src = p.img;
    imgEl.style.display = 'block';
  } else {
    imgEl.style.display = 'none'; // إخفاء الصورة إذا لم توجد
  }

  document.getElementById('modalName').textContent = p.name?.ar || 'منتج';
  document.getElementById('modalPrice').textContent = fmt(p.price);
  document.getElementById('modalDesc').textContent = p.description?.ar || 'لا يوجد وصف تفصيلي لهذا المنتج.';

  document.getElementById('productModal').classList.add('active');
}

// إغلاق النافذة
function closeModal() {
  document.getElementById('productModal').classList.remove('active');
}

// إغلاق النافذة عند الضغط خارجها
document.getElementById('productModal').addEventListener('click', (e) => {
  if (e.target.id === 'productModal') closeModal();
});

loadStore();
</script>
</body>
</html>
