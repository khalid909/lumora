<!doctype html>
<html lang="ar" dir="rtl" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>المتجر — Lumora</title>
<link rel="icon" id="dynamicFavicon" href="icon.svg" type="image/svg+xml">
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  .store-header { background: var(--surface); border-bottom: 1px solid var(--line); padding: 40px 20px; text-align: center; }
  .store-logo { width: 90px; height: 90px; margin: 0 auto 16px; display: flex; align-items: center; justify-content: center; }
  .store-logo img { width: 100%; height: 100%; object-fit: contain; border-radius: 16px; }
  .store-header h1 { font-size: 2rem; margin-bottom: 8px; }
  .store-header p { color: var(--muted); max-width: 600px; margin: 0 auto; }
  
  .store-topbar { background: var(--surface); border-bottom: 1px solid var(--line); padding: 12px; }
  .store-topbar .logo-text { font-weight: 800; font-size: 1.2rem; color: var(--text); text-decoration: none; display: flex; align-items: center; gap: 8px;}
  .store-topbar .logo-text img { width: 30px; height: 30px; object-fit: contain; border-radius: 6px; }

  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(235px,1fr)); gap: 18px; }
  .card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); overflow: hidden; transition: .25s; cursor: pointer; text-decoration: none; color: inherit; display: block; }
  .card:hover { box-shadow: var(--shadow); border-color: var(--p); transform: translateY(-2px); }
  .thumb { position: relative; aspect-ratio: 1; background: var(--surface2); }
  .thumb img { width: 100%; height: 100%; object-fit: cover; }
  .card .body { padding: 14px; }
  .card h3 { font-size: 1rem; line-height: 1.35; margin-bottom: 4px; min-height: 2.7em; }
  .price b { font-size: 1.1rem; color: var(--p); }
</style>
</head>
<body>

<!-- الشريط العلوي للمتجر -->
<div class="topbar store-topbar">
  <div class="wrap" style="display:flex; justify-content:space-between; align-items:center;">
    <a href="#" id="topbarBrand" class="logo-text">
      <span id="topbarName">جاري التحميل...</span>
    </a>
    <a href="index.html" class="btn sm ghost">← العودة للمنصة</a>
  </div>
</div>

<!-- هيدر المتجر -->
<header class="store-header">
  <div class="store-logo" id="storeLogo">S</div>
  <h1 id="storeName">جاري التحميل...</h1>
  <p id="storeDesc">مرحباً بك في متجرنا</p>
</header>

<!-- شبكة المنتجات -->
<main class="wrap" style="padding: 40px 0;">
  <h2 style="margin-bottom: 20px; font-size: 1.4rem;">منتجات المتجر</h2>
  <div class="grid" id="productsGrid">
    <p class="muted" style="grid-column:1/-1; text-align:center;">جاري تحميل المنتجات...</p>
  </div>
</main>

<script>
const sb = window.supabase.createClient(
  'https://mpoqvpqeysgoqjtcwtfk.supabase.co',
  'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im1wb3F2cHFleXNnb3FqdGN3dGZrIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTE0ODE1NTUsImV4cCI6MjEwNzA1NzU1NX0.i0YEZkxAmy4wEnX0QP8Hm2erm1bxPFmO6sp78clevb0'
);
const fmt = n => new Intl.NumberFormat('ar-DZ', { style: 'currency', currency: 'DZD', minimumFractionDigits: 0 }).format(n || 0);

let currentProduct = null;
let currentQty = 1;
const SHIPPING_FEE = 500;

async function loadProduct() {
  const params = new URLSearchParams(window.location.search);
  const id = params.get('id');
  
  if (!id) {
    document.getElementById('productContainer').innerHTML = '<p class="muted" style="text-align:center; grid-column:1/-1;">خطأ: رابط المنتج غير صالح.</p>';
    return;
  }

  // جلب المنتج من قاعدة البيانات
  const { data: product, error } = await sb.from('products').select('*').eq('id', id).maybeSingle();
  
  if (error) {
    document.getElementById('productContainer').innerHTML = `<p class="muted" style="text-align:center; grid-column:1/-1;">حدث خطأ في قاعدة البيانات: ${error.message}</p>`;
    return;
  }
  
  if (!product) {
    document.getElementById('productContainer').innerHTML = '<p class="muted" style="text-align:center; grid-column:1/-1;">عذراً، هذا المنتج غير موجود أو تم حذفه.</p>';
    return;
  }
  
  currentProduct = product;
  
  if (product.img) document.getElementById('dynamicFavicon').href = product.img;

  document.getElementById('productContainer').innerHTML = `
    <!-- الصورة -->
    <div class="product-image">
      <div class="badge-offer">عرض خاص: الدفع عند الاستلام</div>
      ${product.img 
        ? `<img src="${product.img}" alt="${product.name?.ar}">` 
        : `<div style="width:100%; aspect-ratio:1; display:grid; place-items:center; font-size:6rem;">📦</div>`}
    </div>

    <!-- التفاصيل -->
    <div class="product-info">
      <h1>${product.name?.ar || 'منتج'}</h1>
      
      <div class="price-box">
        <span class="price">${fmt(product.price)}</span>
      </div>

      <ul class="features-list">
        <li>${product.description?.ar || 'منتج عالي الجودة يناسب احتياجاتك اليومية.'}</li>
        <li>متوفر الآن في المخزون (${product.stock} قطعة)</li>
        <li>الدفع عند الاستلام — اطلب الآن ويوصلك وين حبيت</li>
      </ul>

      <!-- نموذج الطلب -->
      <div class="order-form">
        <h3>🛒 اطلب الآن</h3>
        
        <div class="form-group">
          <label>اللون</label>
          <div class="color-options">
            <button class="color-btn active" style="background:#000;"></button>
            <button class="color-btn" style="background:#c19a6b;"></button>
            <button class="color-btn" style="background:#1e3a8a;"></button>
            <button class="color-btn" style="background:#dc2626;"></button>
          </div>
        </div>

        <div class="form-group">
          <label>الكمية</label>
          <div class="qty-box">
            <button onclick="updateQty(-1)">−</button>
            <input type="number" id="qtyInput" value="1" min="1" max="${product.stock}" readonly>
            <button onclick="updateQty(1)">+</button>
          </div>
        </div>

        <h3 style="margin-top:20px; font-size:1.1rem;">معلومات الزبون</h3>
        <div class="form-group">
          <label>الاسم الكامل</label>
          <input type="text" id="custName" placeholder="الاسم واللقب">
        </div>
        <div class="form-group">
          <label>رقم الهاتف</label>
          <input type="tel" id="custPhone" placeholder="05xxxxxxxx" dir="ltr">
        </div>
        <div class="form-group">
          <label>العنوان (الولاية والبلدية)</label>
          <input type="text" id="custAddress" placeholder="مثال: الجزائر العاصمة، بئر مراد رايس">
        </div>

        <div class="summary">
          <div class="summary-row">
            <span>سعر المنتج (1x)</span>
            <span id="sumSubtotal">${fmt(product.price)}</span>
          </div>
          <div class="summary-row">
            <span>سعر الشحن</span>
            <span id="sumShipping">${fmt(SHIPPING_FEE)}</span>
          </div>
          <div class="summary-row total">
            <span>الإجمالي المتوقع</span>
            <span id="sumTotal">${fmt(product.price + SHIPPING_FEE)}</span>
          </div>
        </div>

        <button class="btn submit-btn" onclick="submitOrder()">اطلب الآن (الدفع عند الاستلام)</button>
      </div>
    </div>
  `;
}

function updateQty(change) {
  const input = document.getElementById('qtyInput');
  let val = parseInt(input.value) + change;
  if (val < 1) val = 1;
  if (val > currentProduct.stock) val = currentProduct.stock;
  input.value = val;
  currentQty = val;
  
  const subtotal = currentProduct.price * val;
  document.getElementById('sumSubtotal').textContent = fmt(subtotal);
  document.getElementById('sumTotal').textContent = fmt(subtotal + SHIPPING_FEE);
}

async function submitOrder() {
  const name = document.getElementById('custName').value.trim();
  const phone = document.getElementById('custPhone').value.trim();
  const address = document.getElementById('custAddress').value.trim();

  if (!name || !phone || !address) {
    alert('الرجاء ملء جميع معلومات الزبون (الاسم، الهاتف، العنوان).');
    return;
  }

  const orderId = 'ORD' + Math.floor(Math.random() * 1000000);
  const total = (currentProduct.price * currentQty) + SHIPPING_FEE;

  const { error } = await sb.from('orders').insert([{
    id: orderId,
    customer_name: name,
    phone: phone,
    city: 'غير محدد', 
    address: address,
    notes: 'الكمية: ' + currentQty,
    total_amount: total,
    status: 'pending',
    vendor_id: currentProduct.vendor_id,
    items: [{ id: currentProduct.id, name: currentProduct.name?.ar, qty: currentQty, price: currentProduct.price }]
  }]);

  if (error) {
    alert('حدث خطأ أثناء حفظ الطلب: ' + error.message);
    return;
  }

  alert('🎉 تم استلام طلبك بنجاح! سنتصل بك قريباً للتأكيد.');
  window.location.href = 'index.html'; // العودة للرئيسية بعد الطلب
}

loadProduct();
</script>
</body>
</html>
