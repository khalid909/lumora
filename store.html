<!-- ابحث في أعلى الصفحة عن <head> واستبدله بهذا -->
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>المتجر — Lumora</title>
<!-- الأيقونة الافتراضية، سيتم تغييرها عبر الجافاسكريبت -->
<link rel="icon" id="dynamicFavicon" href="icon.svg" type="image/svg+xml">
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  .store-header { background: var(--surface); border-bottom: 1px solid var(--line); padding: 40px 20px; text-align: center; }
  .store-logo { width: 90px; height: 90px; background: var(--grad); color: #fff; border-radius: 24px; display: flex; align-items: center; justify-content: center; font-size: 2.5rem; font-weight: 800; margin: 0 auto 16px; box-shadow: 0 10px 24px -10px rgba(109,74,255,.5); }
  .store-logo img { width: 100%; height: 100%; object-fit: cover; border-radius: 24px; }
  .store-header h1 { font-size: 2rem; margin-bottom: 8px; }
  .store-header p { color: var(--muted); max-width: 600px; margin: 0 auto; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(235px,1fr)); gap: 18px; }
  .card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); overflow: hidden; transition: .25s; }
  .card:hover { box-shadow: var(--shadow); border-color: var(--p); }
  .thumb { position: relative; aspect-ratio: 1; background: var(--surface2); }
  .thumb img { width: 100%; height: 100%; object-fit: cover; }
  .card .body { padding: 14px; }
  .card h3 { font-size: 1rem; line-height: 1.35; margin-bottom: 4px; min-height: 2.7em; }
  .price b { font-size: 1.1rem; color: var(--p); }
</style>
</head>
<body>
<!-- ... باقي الكود كما هو ... -->

<script>
const sb = window.supabase.createClient( /* ... */ );

async function loadStore() {
  const params = new URLSearchParams(window.location.search);
  const slug = params.get('slug');
  if (!slug) return;

  const { data: vendor } = await sb.from('vendors').select('*').eq('store_slug', slug).maybeSingle();
  if (!vendor) return;

  document.title = vendor.store_name + ' — Lumora';
  
  // --- تعديل اللوغو والايقونة هنا ---
  const logoEl = document.getElementById('storeLogo');
  const faviconEl = document.getElementById('dynamicFavicon');
  
  if (vendor.store_logo) {
    // إذا كان هناك صورة مرفوعة
    logoEl.innerHTML = `<img src="${vendor.store_logo}" alt="${vendor.store_name}">`;
    faviconEl.href = vendor.store_logo; // تغيير أيقونة المتصفح
  } else {
    // إذا لم توجد صورة، نستخدم الحرف الأول
    logoEl.textContent = vendor.store_name.charAt(0).toUpperCase();
  }
  
  document.getElementById('storeName').textContent = vendor.store_name;
  if(vendor.store_description) document.getElementById('storeDesc').textContent = vendor.store_description;

  // ... باقي كود عرض المنتجات ...
}
loadStore();
</script>
</body>
</html>
