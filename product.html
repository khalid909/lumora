<!doctype html>
<html lang="ar" dir="rtl" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>تفاصيل المنتج — Lumora</title>
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  .product-wrapper { max-width: 1000px; margin: 40px auto; padding: 20px; display: grid; grid-template-columns: 1fr 1fr; gap: 40px; align-items: start; }
  @media (max-width: 768px) { .product-wrapper { grid-template-columns: 1fr; gap: 20px; } }
  .gallery-container { display: flex; flex-direction: column; gap: 12px; }
  .main-image { background: var(--surface2); border-radius: 20px; overflow: hidden; border: 1px solid var(--line); aspect-ratio: 1; display: flex; align-items: center; justify-content: center; }
  .main-image img { width: 100%; height: 100%; object-fit: cover; }
  .thumbnails { display: flex; gap: 10px; overflow-x: auto; }
  .thumbnails img { width: 70px; height: 70px; object-fit: cover; border-radius: 10px; border: 2px solid transparent; cursor: pointer; }
  .thumbnails img:hover, .thumbnails img.active { border-color: var(--p); }
  .info-box h1 { font-size: 2rem; margin-bottom: 10px; }
  .price { font-size: 2.2rem; font-weight: 800; color: var(--p); margin-bottom: 20px; }
  .desc { color: var(--muted); line-height: 1.8; margin-bottom: 30px; }
  .form-box { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 24px; }
  .form-box h3 { margin-bottom: 20px; font-size: 1.3rem; border-bottom: 1px solid var(--line); padding-bottom: 10px; }
  .form-group { margin-bottom: 15px; }
  .form-group label { display: block; font-weight: 700; margin-bottom: 8px; font-size: 0.9rem; }
  .form-group input { width: 100%; padding: 14px; border: 1px solid var(--line); border-radius: 10px; background: var(--surface2); font-size: 1rem; outline: none; }
  .submit-btn { width: 100%; padding: 18px; font-size: 1.2rem; border-radius: 12px; margin-top: 10px; cursor: pointer; border: none; color: white; background: var(--grad); font-weight: bold; }
  .submit-btn:disabled { opacity: 0.5; }
</style>
</head>
<body>

<div style="background:var(--surface); border-bottom:1px solid var(--line); padding:12px; position:sticky; top:0; z-index:50;">
  <div style="max-width:1000px; margin:0 auto; display:flex; justify-content:space-between; align-items:center;">
    <a href="index.html" style="font-weight:800; text-decoration:none; color:inherit; display:flex; align-items:center; gap:8px;">
      <img src="icon.svg" width="24" height="24" alt=""> Lumora
    </a>
    <a href="javascript:history.back()" class="btn sm ghost">← العودة</a>
  </div>
</div>

<div id="app" class="product-wrapper">
  <p style="grid-column: 1/-1; text-align: center; padding: 50px;">جاري تحميل المنتج...</p>
</div>

<script>
const sb = window.supabase.createClient(
  'https://mpoqvpqeysgoqjtcwtfk.supabase.co',
  'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im1wb3F2cHFleXNnb3FqdGN3dGZrIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTE0ODE1NTUsImV4cCI6MjEwNzA1NzU1NX0.i0YEZkxAmy4wEnX0QP8Hm2erm1bxPFmO6sp78clevb0'
);
const fmt = n => new Intl.NumberFormat('ar-DZ', { style: 'currency', currency: 'DZD', minimumFractionDigits: 0 }).format(n || 0);

async function load() {
  const id = new URLSearchParams(window.location.search).get('id');
  const app = document.getElementById('app');

  if (!id) {
    app.innerHTML = '<h2 style="text-align:center; color:red; grid-column:1/-1;">خطأ: لم يتم العثور على المنتج</h2>';
    return;
  }

  try {
    const { data: p, error } = await sb.from('products').select('*').eq('id', id).single();
    if (error) throw error;
    if (!p) throw new Error("المنتج غير موجود");

    app.innerHTML = `
      <div class="gallery-container">
        <div class="main-image">
          ${p.img ? `<img src="${p.img}" alt="${p.name?.ar}">` : `<div style="font-size:6rem;">📦</div>`}
        </div>
      </div>
      <div class="info-box">
        <h1>${p.name?.ar || 'منتج'}</h1>
        <div class="price">${fmt(p.price)}</div>
        <div class="desc">${p.description?.ar || 'لا يوجد وصف.'}</div>
        
        <div class="form-box">
          <h3>اطلب الآن (الدفع عند الاستلام)</h3>
          <div class="form-group">
            <label>الاسم الكامل</label>
            <input type="text" id="cName" placeholder="الاسم واللقب">
          </div>
          <div class="form-group">
            <label>رقم الهاتف</label>
            <input type="tel" id="cPhone" placeholder="05xxxxxxxx" dir="ltr">
          </div>
          <div class="form-group">
            <label>العنوان</label>
            <input type="text" id="cAddr" placeholder="الولاية، البلدية، الشارع">
          </div>
          <button class="submit-btn" id="orderBtn" onclick="submitOrder('${p.id}', '${p.vendor_id}', ${p.price})">تأكيد الطلب</button>
        </div>
      </div>
    `;
  } catch (err) {
    app.innerHTML = `<div style="grid-column:1/-1; text-align:center;"><h2 style="color:red;">⚠️ خطأ: ${err.message}</h2></div>`;
  }
}

async function submitOrder(pid, vid, price) {
  const name = document.getElementById('cName').value.trim();
  const phone = document.getElementById('cPhone').value.trim();
  const addr = document.getElementById('cAddr').value.trim();
  const btn = document.getElementById('orderBtn');

  if (!name || !phone || !addr) { 
    alert('يرجى ملء جميع الحقول (الاسم، الهاتف، العنوان).'); 
    return; 
  }

  btn.disabled = true;
  btn.textContent = 'جاري تأكيد الطلب...';

  // حفظ الطلب مع ربطه بـ vendor_id
  const { error } = await sb.from('orders').insert([{
    id: 'ORD' + Date.now(),
    customer_name: name,
    phone: phone,
    city: 'غير محدد',
    address: addr,
    total_amount: price, 
    status: 'pending',
    vendor_id: vid ? String(vid) : null,
    notes: 'طلب جديد من المنتج رقم ' + pid
  }]);

  if (error) {
    alert('خطأ في النظام: ' + error.message);
    btn.disabled = false;
    btn.textContent = 'تأكيد الطلب';
  } else {
    alert('🎉 تم استلام طلبك بنجاح! سنتصل بك قريباً للتأكيد.');
    window.location.href = 'index.html';
  }
}

load();
</script>
</body>
</html>
