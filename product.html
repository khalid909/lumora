<!doctype html>
<html lang="ar" dir="rtl" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>تفاصيل المنتج — Lumora</title>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  .product-wrapper { max-width: 1000px; margin: 40px auto; padding: 20px; display: grid; grid-template-columns: 1fr 1fr; gap: 40px; }
  @media (max-width: 768px) { .product-wrapper { grid-template-columns: 1fr; } }
  .img-box { background: var(--surface2); border-radius: 20px; overflow: hidden; border: 1px solid var(--line); }
  .img-box img { width: 100%; height: auto; display: block; }
  .info-box h1 { font-size: 2rem; margin-bottom: 10px; }
  .price { font-size: 2rem; font-weight: 800; color: var(--p); margin-bottom: 20px; }
  .desc { color: var(--muted); line-height: 1.8; margin-bottom: 30px; }
  .form-box { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 20px; }
  .form-box h3 { margin-bottom: 15px; font-size: 1.2rem; }
  .form-group { margin-bottom: 15px; }
  .form-group label { display: block; font-weight: 700; margin-bottom: 8px; font-size: 0.9rem; }
  .form-group input { width: 100%; padding: 12px; border: 1px solid var(--line); border-radius: 10px; background: var(--surface2); font-size: 1rem; outline: none; }
  .submit-btn { width: 100%; padding: 16px; font-size: 1.1rem; border-radius: 12px; margin-top: 20px; cursor: pointer; border: none; color: white; background: var(--grad); font-weight: bold; }
</style>
</head>
<body>

<div style="background:var(--surface); border-bottom:1px solid var(--line); padding:12px;">
  <div style="max-width:1000px; margin:0 auto; display:flex; justify-content:space-between; align-items:center;">
    <a href="index.html" style="font-weight:800; text-decoration:none; color:inherit;">Lumora</a>
    <a href="javascript:history.back()" class="btn sm ghost">← العودة</a>
  </div>
</div>

<div id="app" class="product-wrapper">
  <p style="grid-column: 1/-1; text-align: center; padding: 50px;">جاري التحميل...</p>
</div>

<script>
const sb = window.supabase.createClient(
  'https://mpoqvpqeysgoqjtcwtfk.supabase.co',
  'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im1wb3F2cHFleXNnb3FqdGN3dGZrIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTE0ODE1NTUsImV4cCI6MjEwNzA1NzU1NX0.i0YEZkxAmy4wEnX0QP8Hm2erm1bxPFmO6sp78clevb0'
);
const fmt = n => new Intl.NumberFormat('ar-DZ', { style: 'currency', currency: 'DZD', minimumFractionDigits: 0 }).format(n || 0);

async function load() {
  const id = new URLSearchParams(window.location.search).get('id');
  const app = document.getElementById('app');

  if (!id) {
    app.innerHTML = '<h2 style="grid-column:1/-1; text-align:center; color:red;">خطأ: لم يتم العثور على المنتج</h2>';
    return;
  }

  try {
    // جلب المنتج
    const { data: p, error } = await sb.from('products').select('*').eq('id', id).single();
    
    if (error) throw error;
    if (!p) throw new Error("المنتج غير موجود");

    // عرض البيانات
    app.innerHTML = `
      <div class="img-box">
        ${p.img ? `<img src="${p.img}" alt="${p.name?.ar}">` : `<div style="height:300px; display:grid; place-items:center; font-size:5rem;">📦</div>`}
      </div>
      <div class="info-box">
        <h1>${p.name?.ar || 'منتج'}</h1>
        <div class="price">${fmt(p.price)}</div>
        <div class="desc">${p.description?.ar || 'لا يوجد وصف لهذا المنتج.'}</div>
        
        <div class="form-box">
          <h3>اطلب الآن (الدفع عند الاستلام)</h3>
          <div class="form-group">
            <label>الاسم الكامل</label>
            <input type="text" id="cName" placeholder="الاسم واللقب">
          </div>
          <div class="form-group">
            <label>رقم الهاتف</label>
            <input type="tel" id="cPhone" placeholder="05xxxxxxxx" dir="ltr">
          </div>
          <div class="form-group">
            <label>العنوان</label>
            <input type="text" id="cAddr" placeholder="الولاية، البلدية">
          </div>
          <button class="submit-btn" onclick="order('${p.id}', '${p.vendor_id}', ${p.price})">تأكيد الطلب</button>
        </div>
      </div>
    `;
  } catch (err) {
    app.innerHTML = `
      <div style="grid-column:1/-1; text-align:center; padding:40px;">
        <h2 style="color:red; margin-bottom:10px;">⚠️ حدث خطأ</h2>
        <p>${err.message}</p>
      </div>
    `;
  }
}

async function order(pid, vid, price) {
  const name = document.getElementById('cName').value.trim();
  const phone = document.getElementById('cPhone').value.trim();
  const addr = document.getElementById('cAddr').value.trim();

  if (!name || !phone || !addr) { alert('يرجى ملء جميع الحقول'); return; }

  const { error } = await sb.from('orders').insert([{
    id: 'ORD' + Date.now(),
    customer_name: name,
    phone: phone,
    city: 'غير محدد',
    address: addr,
    total_amount: price + 500,
    status: 'pending',
    vendor_id: vid,
    items: [{ id: pid, qty: 1, price: price }]
  }]);

  if (error) {
    alert('خطأ: ' + error.message);
  } else {
    alert('🎉 تم استلام طلبك بنجاح!');
    window.location.href = 'index.html';
  }
}

load();
</script>
</body>
</html>
