<!doctype html>
<html lang="ar" dir="rtl" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>لوحة التاجر — Lumora</title>
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/admin.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  body { display: flex; min-height: 100vh; background: var(--bg); }
  .sidebar { width: 260px; background: var(--surface); border-inline-end: 1px solid var(--line); display: flex; flex-direction: column; position: fixed; top:0; bottom:0; right:0; z-index:10; }
  .sidebar-header { padding: 24px 20px; display: flex; align-items: center; gap: 10px; font-size: 1.2rem; font-weight: 800; border-bottom: 1px solid var(--line); }
  .sidebar-nav { padding: 20px 12px; display: flex; flex-direction: column; gap: 8px; flex: 1; }
  .nav-item { display: flex; align-items: center; gap: 12px; padding: 12px 16px; border-radius: 12px; color: var(--muted); font-weight: 600; cursor: pointer; transition: 0.2s; border: 0; background: transparent; width: 100%; text-align: right; font-size: 0.95rem; }
  .nav-item:hover { background: var(--surface2); color: var(--text); }
  .nav-item.active { background: var(--grad); color: #fff; }
  .sidebar-footer { padding: 20px; border-top: 1px solid var(--line); }
  .main-content { flex: 1; margin-right: 260px; padding: 30px; overflow-y: auto; }
  .page-section { display: none; }
  .page-section.active { display: block; }
  .top-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px; }
  .welcome-banner { background: var(--grad); color: #fff; padding: 30px; border-radius: 20px; margin-bottom: 24px; }
  .stats-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; margin-bottom: 30px; }
  .stat-card { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 24px; text-align: center; }
  .stat-card h3 { margin: 0 0 8px 0; font-size: 0.9rem; color: var(--muted); }
  .stat-card .val { font-size: 2rem; font-weight: 800; color: var(--text); }
  .card { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 24px; margin-bottom: 24px; }
  .table-wrap { overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; }
  th, td { padding: 14px; text-align: right; border-bottom: 1px solid var(--line); font-size: 0.9rem; }
  th { color: var(--muted); font-weight: 700; background: var(--surface2); }
  .prod-img { width: 50px; height: 50px; border-radius: 8px; object-fit: cover; background: var(--surface2); }
  .form-group { margin-bottom: 15px; }
  .form-group label { display: block; font-weight: 700; margin-bottom: 8px; font-size: 0.9rem; }
  .form-group input, .form-group select { width: 100%; padding: 12px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface2); }
  .btn-full { width: 100%; padding: 14px; font-size: 1rem; border-radius: 8px; margin-top: 10px; cursor: pointer; border: none; color: white; background: var(--grad); font-weight: bold; }
  
  /* نافذة التعديل */
  .modal { position: fixed; inset: 0; background: rgba(0,0,0,0.6); display: none; align-items: center; justify-content: center; z-index: 100; }
  .modal.active { display: flex; }
  .modal-content { background: var(--surface); padding: 24px; border-radius: 16px; width: 100%; max-width: 400px; }

  @media(max-width: 900px) {
    .sidebar { transform: translateX(100%); transition: 0.3s; }
    .sidebar.open { transform: none; }
    .main-content { margin-right: 0; }
    .stats-grid { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>

<aside class="sidebar" id="sidebar">
  <div class="sidebar-header"><img src="icon.svg" width="30" height="30"><span>Lumora</span></div>
  <nav class="sidebar-nav">
    <button class="nav-item active" data-target="home">📊 الرئيسية</button>
    <button class="nav-item" data-target="orders">🛒 الطلبات</button>
    <button class="nav-item" data-target="products">📦 المنتجات</button>
    <button class="nav-item" data-target="add">➕ إضافة منتج</button>
  </nav>
  <div class="sidebar-footer"><button class="btn danger block sm" id="logoutBtn">خروج</button></div>
</aside>

<main class="main-content">
  <div class="top-bar"><h1 id="pageTitle">الرئيسية</h1></div>

  <section class="page-section active" id="sec-home">
    <div class="welcome-banner">
      <h2 id="storeName">جاري التحميل...</h2>
      <p>مرحباً بك في لوحة تحكم متجرك</p>
    </div>
    <div class="stats-grid">
      <div class="stat-card"><h3>إجمالي المبيعات</h3><div class="val" id="statSales">0 دج</div></div>
      <div class="stat-card"><h3>إجمالي الطلبات</h3><div class="val" id="statOrders">0</div></div>
      <div class="stat-card"><h3>المنتجات النشطة</h3><div class="val" id="statProducts">0</div></div>
    </div>
  </section>

  <section class="page-section" id="sec-orders">
    <div class="card">
      <h3 style="margin-bottom:20px;">جميع الطلبات</h3>
      <div id="allOrdersList"><p class="muted">جاري التحميل...</p></div>
    </div>
  </section>

  <section class="page-section" id="sec-products">
    <div class="card">
      <h3 style="margin-bottom:20px;">المنتجات المعروضة</h3>
      <div class="table-wrap" id="allProductsList"><p class="muted">جاري التحميل...</p></div>
    </div>
  </section>

  <section class="page-section" id="sec-add">
    <div class="card">
      <h3 style="margin-bottom:20px;">إضافة منتج جديد</h3>
      <form id="addProductForm">
        <div class="form-group"><label>اسم المنتج *</label><input type="text" id="pName" required></div>
        <div class="form-group"><label>السعر (دج) *</label><input type="number" id="pPrice" required min="0"></div>
        <div class="form-group"><label>المخزون *</label><input type="number" id="pStock" required min="1" value="10"></div>
        <div class="form-group">
          <label>الفئة</label>
          <select id="pCat">
            <option value="fashion">أزياء</option>
            <option value="tech">إلكترونيات</option>
            <option value="home">المنزل</option>
            <option value="beauty">جمال</option>
            <option value="sport">رياضة</option>
          </select>
        </div>
        <div class="form-group"><label>رابط الصورة (اختياري)</label><input type="url" id="pImg" placeholder="https://..."></div>
        <button type="submit" class="btn-full">حفظ المنتج</button>
      </form>
    </div>
  </section>
</main>

<!-- نافذة التعديل -->
<div class="modal" id="editModal">
  <div class="modal-content">
    <h3 style="margin-bottom:20px;">تعديل المنتج</h3>
    <form id="editProductForm">
      <input type="hidden" id="editId">
      <div class="form-group"><label>اسم المنتج</label><input type="text" id="editName" required></div>
      <div class="form-group"><label>السعر</label><input type="number" id="editPrice" required></div>
      <div class="form-group"><label>المخزون</label><input type="number" id="editStock" required></div>
      <div style="display:flex; gap:10px; margin-top:15px;">
        <button type="submit" class="btn-full" style="margin:0;">حفظ</button>
        <button type="button" class="btn-full" onclick="closeModal()" style="margin:0; background:var(--muted);">إلغاء</button>
      </div>
    </form>
  </div>
</div>

<script>
const sb = window.supabase.createClient(
  'https://mpoqvpqeysgoqjtcwtfk.supabase.co',
  'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im1wb3F2cHFleXNnb3FqdGN3dGZrIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTE0ODE1NTUsImV4cCI6MjEwNzA1NzU1NX0.i0YEZkxAmy4wEnX0QP8Hm2erm1bxPFmO6sp78clevb0'
);
const fmt = n => new Intl.NumberFormat('ar-DZ', { style: 'currency', currency: 'DZD', minimumFractionDigits: 0 }).format(n || 0);
let currentVendor = null;

document.querySelectorAll('.nav-item').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.nav-item').forEach(b => b.classList.remove('active'));
    document.querySelectorAll('.page-section').forEach(s => s.classList.remove('active'));
    btn.classList.add('active');
    document.getElementById(`sec-${btn.dataset.target}`).classList.add('active');
    document.getElementById('pageTitle').textContent = btn.textContent.trim();
    if(btn.dataset.target === 'orders') loadOrders();
    if(btn.dataset.target === 'products') loadProducts();
  });
});

async function init() {
  const { data: { session } } = await sb.auth.getSession();
  if (!session) { location.href = 'vendor-login.html'; return; }

  const { data: vendor } = await sb.from('vendors').select('*').eq('user_id', session.user.id).maybeSingle();
  if (!vendor) { alert('لا يوجد متجر'); return; }

  currentVendor = vendor;
  document.getElementById('storeName').textContent = vendor.store_name;
  loadOrders();
  loadProducts();
}

async function loadOrders() {
  const el = document.getElementById('allOrdersList');
  const { data: orders } = await sb.from('orders').select('*').eq('vendor_id', currentVendor.id).order('created_at', { ascending: false });
  if (!orders || orders.length === 0) { el.innerHTML = '<p class="muted" style="text-align:center;">لا توجد طلبات.</p>'; return; }

  document.getElementById('statOrders').textContent = orders.length;
  let total = 0; orders.forEach(o => total += Number(o.total_amount || 0));
  document.getElementById('statSales').textContent = fmt(total);

  el.innerHTML = orders.map(o => `
    <div style="border:1px solid var(--line); border-radius:12px; padding:16px; margin-bottom:10px;">
      <div style="display:flex; justify-content:space-between; margin-bottom:10px; font-weight:bold;">
        <span>#${o.id}</span><span style="color:var(--p)">${fmt(o.total_amount)}</span>
      </div>
      <div style="font-size:0.9rem; color:var(--muted); background:var(--surface2); padding:10px; border-radius:8px;">
        👤 ${o.customer_name}<br>📞 ${o.phone}<br>📍 ${o.address}
      </div>
    </div>
  `).join('');
}

async function loadProducts() {
  const el = document.getElementById('allProductsList');
  const { data: products } = await sb.from('products').select('*').eq('vendor_id', currentVendor.id);
  
  if (!products || products.length === 0) { el.innerHTML = '<p class="muted">لا توجد منتجات.</p>'; return; }
  document.getElementById('statProducts').textContent = products.length;

  el.innerHTML = `<table><thead><tr><th>الصورة</th><th>الاسم</th><th>السعر</th><th>المخزون</th><th>إجراءات</th></tr></thead><tbody>
    ${products.map(p => `<tr>
      <td>${p.img ? `<img src="${p.img}" class="prod-img">` : `<div class="prod-img" style="display:grid; place-items:center;">📦</div>`}</td>
      <td><b>${p.name?.ar || 'منتج'}</b></td>
      <td>${fmt(p.price)}</td>
      <td>${p.stock}</td>
      <td style="white-space:nowrap;">
        <button onclick="openEdit('${p.id}', '${p.name?.ar}', ${p.price}, ${p.stock})" style="background:none; border:none; cursor:pointer; font-size:1.1rem;" title="تعديل">✏️</button>
        <button onclick="deleteProduct('${p.id}')" style="background:none; border:none; cursor:pointer; font-size:1.1rem; color:red;" title="حذف">🗑️</button>
      </td>
    </tr>`).join('')}
  </tbody></table>`;
}

// إضافة منتج
document.getElementById('addProductForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const btn = e.target.querySelector('button');
  btn.disabled = true; btn.textContent = 'جاري الحفظ...';

  const { error } = await sb.from('products').insert([{
    vendor_id: currentVendor.id,
    store_slug: currentVendor.store_slug,
    name: { ar: document.getElementById('pName').value, fr: '', en: '' },
    price: Number(document.getElementById('pPrice').value),
    stock: Number(document.getElementById('pStock').value),
    cat: document.getElementById('pCat').value,
    img: document.getElementById('pImg').value,
    description: { ar: 'منتج جديد', fr: '', en: '' }
  }]);

  btn.disabled = false; btn.textContent = 'حفظ المنتج';
  if (error) { alert(error.message); return; }

  document.getElementById('addProductForm').reset();
  loadProducts();
});

// فتح نافذة التعديل
function openEdit(id, name, price, stock) {
  document.getElementById('editId').value = id;
  document.getElementById('editName').value = name;
  document.getElementById('editPrice').value = price;
  document.getElementById('editStock').value = stock;
  document.getElementById('editModal').classList.add('active');
}

function closeModal() {
  document.getElementById('editModal').classList.remove('active');
}

// حفظ التعديلات
document.getElementById('editProductForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const id = document.getElementById('editId').value;
  const btn = e.target.querySelector('button[type=submit]');
  btn.disabled = true; btn.textContent = 'جاري الحفظ...';

  const { error } = await sb.from('products').update({
    name: { ar: document.getElementById('editName').value, fr: '', en: '' },
    price: Number(document.getElementById('editPrice').value),
    stock: Number(document.getElementById('editStock').value)
  }).eq('id', id);

  btn.disabled = false; btn.textContent = 'حفظ';
  if (error) { alert(error.message); return; }

  closeModal();
  loadProducts();
});

// حذف منتج
async function deleteProduct(id) {
  if (!confirm('حذف هذا المنتج؟')) return;
  await sb.from('products').delete().eq('id', id);
  loadProducts();
}

document.getElementById('logoutBtn').addEventListener('click', async () => {
  await sb.auth.signOut();
  location.href = 'vendor-login.html';
});

init();
</script>
</body>
</html>
