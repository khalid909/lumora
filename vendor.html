<!doctype html>
<html lang="ar" dir="rtl" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>لوحة التاجر — Lumora</title>
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/admin.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  body { display: flex; min-height: 100vh; background: var(--bg); }
  .sidebar { width: 260px; background: var(--surface); border-inline-end: 1px solid var(--line); display: flex; flex-direction: column; position: fixed; top:0; bottom:0; right:0; z-index:10; }
  .sidebar-header { padding: 24px 20px; display: flex; align-items: center; gap: 10px; font-size: 1.2rem; font-weight: 800; border-bottom: 1px solid var(--line); }
  .sidebar-nav { padding: 20px 12px; display: flex; flex-direction: column; gap: 8px; flex: 1; }
  .nav-item { display: flex; align-items: center; gap: 12px; padding: 12px 16px; border-radius: 12px; color: var(--muted); font-weight: 600; cursor: pointer; transition: 0.2s; border: 0; background: transparent; width: 100%; text-align: right; font-size: 0.95rem; }
  .nav-item:hover { background: var(--surface2); color: var(--text); }
  .nav-item.active { background: var(--grad); color: #fff; box-shadow: 0 8px 16px -8px rgba(109,74,255,.4); }
  .sidebar-footer { padding: 20px; border-top: 1px solid var(--line); }

  .main-content { flex: 1; margin-right: 260px; padding: 30px; overflow-y: auto; }
  .page-section { display: none; animation: fade 0.3s; }
  .page-section.active { display: block; }
  .top-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px; }
  .top-bar h1 { font-size: 1.6rem; margin: 0; }

  .welcome-banner { background: var(--grad); color: #fff; padding: 30px; border-radius: 20px; display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px; }
  .welcome-banner h2 { margin: 0 0 8px 0; font-size: 1.5rem; display: flex; align-items: center; gap: 10px; }
  .store-logo { width: 50px; height: 50px; background: #fff; color: var(--p); border-radius: 12px; display: grid; place-items: center; font-size: 1.5rem; font-weight: 800; object-fit: cover; overflow: hidden; }
  .store-logo img { width: 100%; height: 100%; object-fit: cover; }

  .stats-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; margin-bottom: 30px; }
  .stat-card { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 24px; text-align: center; }
  .stat-card h3 { margin: 0 0 8px 0; font-size: 0.9rem; color: var(--muted); }
  .stat-card .val { font-size: 2rem; font-weight: 800; color: var(--text); }
  
  .card { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 24px; margin-bottom: 24px; }
  .card-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; padding-bottom: 16px; border-bottom: 1px solid var(--line); }
  
  .table-wrap { overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; }
  th, td { padding: 14px; text-align: right; border-bottom: 1px solid var(--line); font-size: 0.9rem; }
  th { color: var(--muted); font-weight: 700; background: var(--surface2); }
  .prod-img { width: 50px; height: 50px; border-radius: 8px; object-fit: cover; background: var(--surface2); }

  /* Modal for editing */
  .modal { position: fixed; inset: 0; background: rgba(0,0,0,0.6); display: none; align-items: center; justify-content: center; z-index: 100; padding: 20px; }
  .modal.active { display: flex; }
  .modal-content { background: var(--surface); border-radius: 16px; padding: 24px; width: 100%; max-width: 500px; }
  .modal-content h3 { margin-bottom: 20px; }

  @media(max-width: 900px) {
    .sidebar { transform: translateX(100%); transition: 0.3s; }
    .sidebar.open { transform: none; }
    .main-content { margin-right: 0; }
    .stats-grid { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>

<aside class="sidebar" id="sidebar">
  <div class="sidebar-header">
    <img src="icon.svg" width="30" height="30" alt="">
    <span>Lumora</span>
  </div>
  <nav class="sidebar-nav">
    <button class="nav-item active" data-target="home">📊 الرئيسية</button>
    <button class="nav-item" data-target="orders">🛒 الطلبات</button>
    <button class="nav-item" data-target="products">📦 المنتجات</button>
    <button class="nav-item" data-target="settings">⚙️ إعدادات المتجر</button>
  </nav>
  <div class="sidebar-footer">
    <button class="btn danger block sm" id="logoutBtn">خروج</button>
  </div>
</aside>

<main class="main-content">
  <div class="top-bar">
    <h1 id="pageTitle">الرئيسية</h1>
    <div style="display:flex; gap:10px;">
      <a id="visitStoreBtn" href="#" target="_blank" class="btn sm">🔗 زيارة المتجر</a>
      <button class="btn ghost sm" onclick="document.getElementById('sidebar').classList.toggle('open')" style="display:none" id="menuBtn">☰</button>
    </div>
  </div>

  <section class="page-section active" id="sec-home">
    <div class="welcome-banner">
      <div>
        <h2>
          <div class="store-logo" id="storeLogo">H</div>
          <span id="storeName">جاري التحميل...</span>
        </h2>
        <p>مرحباً بك في لوحة تحكم متجرك</p>
      </div>
    </div>
    <div class="stats-grid">
      <div class="stat-card"><h3>إجمالي المبيعات</h3><div class="val" id="statSales">0 دج</div></div>
      <div class="stat-card"><h3>إجمالي الطلبات</h3><div class="val" id="statOrders">0</div></div>
      <div class="stat-card"><h3>المنتجات النشطة</h3><div class="val" id="statProducts">0</div></div>
    </div>
  </section>

  <section class="page-section" id="sec-orders">
    <div class="card">
      <div class="card-header"><h3>جميع الطلبات</h3></div>
      <div class="table-wrap" id="allOrdersList"><p class="muted" style="text-align:center; padding:20px;">لا توجد طلبات</p></div>
    </div>
  </section>

  <section class="page-section" id="sec-products">
    <!-- نموذج إضافة منتج -->
    <div class="card" style="background:var(--surface2); border: 1px dashed var(--p);">
      <h3 style="margin-top:0; margin-bottom:16px;">➕ إضافة منتج جديد</h3>
      <form id="addProductForm" class="form-stack" style="display:grid; grid-template-columns:1fr 1fr; gap:12px;">
        <label><span>اسم المنتج *</span><input type="text" name="name" required></label>
        <label><span>السعر (دج) *</span><input type="number" name="price" required min="0"></label>
        <label><span>المخزون *</span><input type="number" name="stock" required min="1" value="10"></label>
        <label><span>الفئة</span>
          <select name="cat">
            <option value="fashion">أزياء</option>
            <option value="tech">إلكترونيات</option>
            <option value="home">المنزل</option>
            <option value="beauty">جمال</option>
            <option value="sport">رياضة</option>
          </select>
        </label>
        <label style="grid-column:1/-1"><span>صورة المنتج (من الجهاز)</span><input type="file" id="prodImgFile" accept="image/*"></label>
        <label style="grid-column:1/-1"><span>أو رابط الصورة (اختياري)</span><input type="url" name="img" placeholder="https://..."></label>
        <button type="submit" class="btn" style="grid-column:1/-1">حفظ المنتج</button>
        <p class="err" id="prodErr" hidden style="grid-column:1/-1"></p>
      </form>
    </div>

    <!-- جدول المنتجات -->
    <div class="card">
      <div class="card-header"><h3>المنتجات المعروضة</h3></div>
      <div class="table-wrap" id="allProductsList"><p class="muted" style="text-align:center; padding:20px;">جاري التحميل...</p></div>
    </div>
  </section>

  <section class="page-section" id="sec-settings">
    <div class="card">
      <div class="card-header"><h3>بيانات المتجر والشعار</h3></div>
      <div style="display:grid; gap:16px; max-width:500px;" id="settingsForm">
        <label><span>اسم المتجر</span><br><b id="setName">...</b></label>
        <label><span>البريد الإلكتروني</span><br><b id="setEmail">...</b></label>
        <hr style="border:0; border-top:1px solid var(--line); margin:10px 0;">
        <div style="display:flex; align-items:center; gap:20px;">
          <div class="store-logo" id="setLogoPreview" style="width:80px; height:80px; font-size:2rem;">H</div>
          <div style="flex:1;">
            <label style="display:block; margin-bottom:8px; font-weight:bold;">شعار المتجر (Logo / Favicon)</label>
            <input type="file" id="logoUpload" accept="image/*" style="display:block; width:100%;">
          </div>
        </div>
        <button class="btn" id="uploadBtn" style="margin-top:10px;">حفظ الشعار</button>
      </div>
    </div>
  </section>
</main>

<!-- نافذة تعديل المنتج -->
<div class="modal" id="editModal">
  <div class="modal-content">
    <h3>تعديل المنتج</h3>
    <form id="editProductForm" class="form-stack" style="display:grid; gap:12px;">
      <input type="hidden" name="id">
      <label><span>اسم المنتج</span><input type="text" name="name" required></label>
      <label><span>السعر</span><input type="number" name="price" required></label>
      <label><span>المخزون</span><input type="number" name="stock" required></label>
      <div style="display:flex; gap:10px; margin-top:10px;">
        <button type="submit" class="btn" style="flex:1;">حفظ التعديلات</button>
        <button type="button" class="btn ghost" onclick="closeEditModal()">إلغاء</button>
      </div>
    </form>
  </div>
</div>

<script>
const sb = window.supabase.createClient(
  'https://mpoqvpqeysgoqjtcwtfk.supabase.co',
  'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im1wb3F2cHFleXNnb3FqdGN3dGZrIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTE0ODE1NTUsImV4cCI6MjEwNzA1NzU1NX0.i0YEZkxAmy4wEnX0QP8Hm2erm1bxPFmO6sp78clevb0'
);
const $ = s => document.querySelector(s);
const fmt = n => new Intl.NumberFormat('ar-DZ', { style: 'currency', currency: 'DZD', minimumFractionDigits: 0 }).format(n || 0);

let currentVendor = null;

document.querySelectorAll('.nav-item').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.nav-item').forEach(b => b.classList.remove('active'));
    document.querySelectorAll('.page-section').forEach(s => s.classList.remove('active'));
    btn.classList.add('active');
    document.getElementById(`sec-${btn.dataset.target}`).classList.add('active');
    document.getElementById('pageTitle').textContent = btn.textContent.trim();
    if(window.innerWidth <= 900) document.getElementById('sidebar').classList.remove('open');
    if(btn.dataset.target === 'settings') loadSettings();
  });
});

async function init() {
  const { data: { session } } = await sb.auth.getSession();
  if (!session) { location.href = 'vendor-login.html'; return; }

  const { data: vendor } = await sb.from('vendors').select('*').eq('user_id', session.user.id).maybeSingle();
  if (!vendor) { alert('لا يوجد متجر'); return; }

  currentVendor = vendor;
  document.getElementById('storeName').textContent = vendor.store_name;
  document.getElementById('visitStoreBtn').href = `store.html?slug=${vendor.store_slug}`;
  
  if (vendor.store_logo) {
    document.getElementById('storeLogo').innerHTML = `<img src="${vendor.store_logo}">`;
  } else {
    document.getElementById('storeLogo').textContent = vendor.store_name.charAt(0).toUpperCase();
  }
  
  loadProducts();
}

async function loadProducts() {
  const el = document.getElementById('allProductsList');
  const { data } = await sb.from('products').select('*').eq('vendor_id', currentVendor.id).order('created_at', { ascending: false });
  
  if (!data || data.length === 0) {
    el.innerHTML = '<p class="muted" style="text-align:center; padding:20px;">لا توجد منتجات.</p>';
    return;
  }
  document.getElementById('statProducts').textContent = data.length;

  el.innerHTML = `<table><thead><tr><th>الصورة</th><th>المنتج</th><th>السعر</th><th>المخزون</th><th>إجراءات</th></tr></thead><tbody>
    ${data.map(p => `<tr>
      <td>${p.img ? `<img src="${p.img}" class="prod-img">` : `<div class="prod-img" style="display:grid; place-items:center;">📦</div>`}</td>
      <td><b>${p.name?.ar || 'منتج'}</b></td>
      <td>${fmt(p.price)}</td>
      <td>${p.stock}</td>
      <td>
        <button class="btn ghost sm" onclick="openEditModal('${p.id}', '${p.name?.ar}', ${p.price}, ${p.stock})">✏️</button>
        <button class="btn danger sm" onclick="deleteProduct('${p.id}')">🗑️</button>
      </td>
    </tr>`).join('')}
  </tbody></table>`;
}

// إضافة منتج مع رفع الصورة
document.getElementById('addProductForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const btn = e.target.querySelector('button[type=submit]');
  const err = document.getElementById('prodErr');
  err.hidden = true;
  btn.disabled = true; btn.textContent = 'جارٍ الحفظ...';

  const fd = Object.fromEntries(new FormData(e.target));
  let imgUrl = fd.img || '';
  
  // رفع الصورة إذا تم اختيارها
  const fileInput = document.getElementById('prodImgFile');
  const file = fileInput.files[0];
  
  if (file) {
    const fileName = `prod-${Date.now()}.${file.name.split('.').pop()}`;
    const { error: uploadError } = await sb.storage.from('vendor-assets').upload(fileName, file);
    if (!uploadError) {
      const { data } = sb.storage.from('vendor-assets').getPublicUrl(fileName);
      imgUrl = data.publicUrl;
    } else {
      err.textContent = 'فشل رفع الصورة: ' + uploadError.message; err.hidden = false;
    }
  }

  const newProduct = {
    vendor_id: currentVendor.id,
    store_slug: currentVendor.store_slug,
    name: { ar: fd.name, fr: fd.name, en: fd.name },
    description: { ar: 'منتج جديد', fr: '', en: '' },
    price: Number(fd.price),
    stock: Number(fd.stock),
    cat: fd.cat || 'tech',
    img: imgUrl
  };

  const { error } = await sb.from('products').insert([newProduct]);
  btn.disabled = false; btn.textContent = 'حفظ المنتج';

  if (error) { err.textContent = error.message; err.hidden = false; return; }
  
  e.target.reset();
  loadProducts();
});

// فتح نافذة التعديل
function openEditModal(id, name, price, stock) {
  const form = document.getElementById('editProductForm');
  form.id.value = id;
  form.name.value = name;
  form.price.value = price;
  form.stock.value = stock;
  document.getElementById('editModal').classList.add('active');
}

function closeEditModal() {
  document.getElementById('editModal').classList.remove('active');
}

// حفظ التعديلات
document.getElementById('editProductForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const fd = Object.fromEntries(new FormData(e.target));
  
  const { error } = await sb.from('products').update({
    name: { ar: fd.name, fr: fd.name, en: fd.name },
    price: Number(fd.price),
    stock: Number(fd.stock)
  }).eq('id', fd.id);

  if (!error) {
    closeEditModal();
    loadProducts();
  } else {
    alert(error.message);
  }
});

// حذف منتج
async function deleteProduct(id) {
  if (!confirm('هل أنت متأكد من حذف هذا المنتج؟')) return;
  const { error } = await sb.from('products').delete().eq('id', id);
  if (!error) loadProducts();
  else alert(error.message);
}

function loadSettings() {
  document.getElementById('setName').textContent = currentVendor.store_name;
  document.getElementById('setEmail').textContent = currentVendor.email;
  const preview = document.getElementById('setLogoPreview');
  if (currentVendor.store_logo) {
    preview.innerHTML = `<img src="${currentVendor.store_logo}" style="width:100%; height:100%; object-fit:cover; border-radius:12px;">`;
  } else {
    preview.textContent = currentVendor.store_name.charAt(0).toUpperCase();
  }
}

document.getElementById('uploadBtn').addEventListener('click', async () => {
  const file = document.getElementById('logoUpload').files[0];
  if (!file) return alert('الرجاء اختيار صورة');
  const btn = document.getElementById('uploadBtn');
  btn.disabled = true; btn.textContent = 'جارٍ الرفع...';

  const fileName = `logo-${currentVendor.id}-${Date.now()}.${file.name.split('.').pop()}`;
  const { error: uploadError } = await sb.storage.from('vendor-assets').upload(fileName, file);
  
  if (!uploadError) {
    const { data } = sb.storage.from('vendor-assets').getPublicUrl(fileName);
    await sb.from('vendors').update({ store_logo: data.publicUrl }).eq('id', currentVendor.id);
    currentVendor.store_logo = data.publicUrl;
    alert('تم حفظ الشعار!');
    loadSettings();
    document.getElementById('storeLogo').innerHTML = `<img src="${data.publicUrl}">`;
  } else {
    alert('خطأ: ' + uploadError.message);
  }
  
  btn.disabled = false; btn.textContent = 'حفظ الشعار';
});

if(window.innerWidth <= 900) document.getElementById('menuBtn').style.display = 'block';
init();
</script>
</body>
</html>
