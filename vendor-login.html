);
const $ = s => document.querySelector(s);

$('#loginForm')?.addEventListener('submit', async e => {
  e.preventDefault();
  const btn = $('#loginBtn'), err = $('#loginErr');
  if(err) err.hidden = true;
  if(btn) { btn.disabled = true; btn.textContent = 'جارٍ التحقق…'; }

  const fd = Object.fromEntries(new FormData(e.target));
  const { data, error } = await sb.auth.signInWithPassword({
    email: fd.email,
    password: fd.password
  });

  if(btn) { btn.disabled = false; btn.textContent = 'دخول للوحة التاجر'; }

  if (error) {
    if(err) { err.textContent = 'البريد أو كلمة المرور غير صحيحة'; err.hidden = false; }
    else alert('البريد أو كلمة المرور غير صحيحة');
    return;
  }

  // التحويل للوحة التاجر
  location.href = 'vendor.html';
});
</script>
